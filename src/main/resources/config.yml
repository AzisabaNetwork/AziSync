# default config.yml for AziSync

# config version
version: 1.0

# storage type (SQL or HYBRID)
# SQL: MySQL/MariaDB only
# HYBRID: MySQL/MariaDB is persistent storage; Redis is used for fast temporary coordination/cache
storage:
  type: SQL

# redis connection
redis:
  host: localhost
  port: 6379
  username: "azisync"
  password: "azisync"
  timeout: 2000

# database connection
database:
  host: localhost
  port: 3306
  database: "azisync"
  username: "azisync"
  password: "azisync"
  useSSL: false
  databaseName: "azisync"
  TablesNames:
    inventoryTableName: "azisync_inventory"
    enderChestTableName: "azisync_enderchest"
    experienceTableName: "azisync_experience"
    potionEffectsTableName: "azisync_potioneffects"
    advancementTableName: "azisync_advancement"
    healthFoodAirTableName: "azisync_healthfoodair"
    locationTableName: "azisync_location"
    economyTableName: "azisync_economy"
    craftGuiTableName: "azisync_craftgui"
    syncStateTableName: "azisync_sync_state"


general:
  # Set this to a unique proxy/server identifier to make cross-server audit logs searchable.
  # When empty, the Minecraft server port is used.
  serverId: ""
  enableModules:
    shareInventory: false
    shareGameMode: false
    shareArmor: false
    shareEnderChest: false
    shareExperience: false
    sharePotionEffects: false
    shareAdvancement: false
    shareHealth: false
    shareFood: false
    shareAir: false
    shareLocation: false
    shareBedSpawn: false
    shareEconomy: false
    shareCraftGui: false
  economyOptions:
    ChestShop-Support: false
    ShopChest-Support: false
    AuctionHouse-Support: false
    CrazyAuctions-Support: false
    EssentialsEconomyCommands-Support: false
  saveDataTask:
    enabled: false
    interval: 300 # in seconds
    hideLogMessage: false
  disableSounds: false
  disableCreativeItemShare: false
  kickOnFailedSync: false
  # Delay loading synced data after join so other join handlers can finish first.
  loadDelayTicks: 5
  # Cross-server handoff coordination. Completed saves continue immediately after
  # a small grace period; active saves are polled until completion.
  syncWait:
    handoffGraceMillis: 100
    pollMillis: 50
    timeoutMillis: 10000
    lockTimeoutSeconds: 10
  # Jobs has no completion callback, so AziSync polls its saving state. A save that
  # finishes quickly continues within pollMillis instead of waiting a fixed delay.
  jobsWait:
    pollMillis: 25
    timeoutMillis: 5000
  economyAudit:
    enabled: true
    logSuccess: true
    logStackTraces: true
  locationSyncOptions:
    onlineTimeToSaveLocation: 0

debugMessage:
  EconomySync: false
  InventorySync: false
  HealthSync: false

# Data migration from other plugins
migration:
  mpdb:
    # Automatically read connection details from plugins/MysqlPlayerDataBridge/config.yml if present
    autoDetectFromPlugin: true
    # Set to true to use AziSync's database connection (same host/user/password/database)
    # Ignored if autoDetectFromPlugin is true and MysqlPlayerDataBridge config is found.
    useMainDatabase: false
    # Manual connection settings when auto-detection is disabled or MPDB is on another server
    host: 192.168.100.101
    port: 3306
    database: "life_userdata"
    username: "life_userdata"
    password: "life_userdata"
    useSSL: false
    # Table names for MPDB
    tables:
      inventory: "mpdb_inventory"
      enderchest: "mpdb_enderchest"
      experience: "mpdb_experience"
      potionEffects: "mpdb_potionEffects"
      healthFoodAir: "mpdb_health_food_air"
      location: "mpdb_location"
      economy: "mpdb_economy"
